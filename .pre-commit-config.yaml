# enforces:
## tab = 4 spaces (per .editorconfig)
## no trailing whitespace, final newline
## shfmt -i 0 (reads .editorconfig)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-executables-have-shebangs

  - repo: local
    hooks:
      - id: shfmt
        name: shfmt (tabs, -i 0)
        entry: shfmt -i 0 -w
        language: system
        types: [shell]
