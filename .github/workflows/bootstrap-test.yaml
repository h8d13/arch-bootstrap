name: bootstrap-test

# The whole point of this script is bootstrapping Arch from a non-Arch GNU distro.
# Running it on an Ubuntu runner is the canonical proof that the claim holds.

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'

jobs:
  bootstrap-from-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # - name: Install host dependencies
      #   run: sudo apt-get update && sudo apt-get upgrade
        # bash, coreutils, curl, sed, gawk, tar, gzip, chroot, xz, zstd - all already on base image.

      - name: Bootstrap a base Arch system
        run: |
          # CI: bootstrap onto a real loopback filesystem so /tmp/myarch is a genuine
          # mountpoint -> pacman CheckSpace works under -c, exactly like a real install
          # onto a mounted device. (A plain dir on / is not a mountpoint; a self-bind
          # would break the bootstrap's own /sys teardown via mount propagation.)
          truncate -s 3G /tmp/arch.img
          mkfs.ext4 -qF /tmp/arch.img
          sudo mkdir -p /tmp/myarch
          sudo mount -o loop /tmp/arch.img /tmp/myarch
          sudo ./arch-bootstrap.sh /tmp/myarch

      - name: Assert the official pacman.conf was restored
        run: |
          set -eux
          # SigLevel back to the secure default, bootstrap-temp markers gone
          grep -qE '^SigLevel[[:space:]]*=[[:space:]]*Required' /tmp/myarch/etc/pacman.conf
          ! grep -qx 'SigLevel = Never' /tmp/myarch/etc/pacman.conf
          ! grep -q 'curl -k' /tmp/myarch/etc/pacman.conf

      # -c does the chroot setup (proc/sys/dev + resolv.conf) and teardown itself,
      # and propagates the command's exit code, so the whole mount/chroot/umount
      # dance collapses into one call.
      - name: Verify pacman, keyring and signed install (via -c)
        run: |
          sudo ./arch-bootstrap.sh -c /tmp/myarch bash -c '
            set -eux
            pacman -Sy --noconfirm                 # repos reachable
            pacman -S --noconfirm fastfetch        # download + sig-verify + install
            fastfetch                              # installed binary runs
          '

      - name: Smoke-test -c with a one-off command
        run: sudo ./arch-bootstrap.sh -c /tmp/myarch echo "hello, world!"
